name: Publish desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($tagVersion -ne $packageVersion) {
            throw "Tag ${{ github.ref_name }} does not match package.json version $packageVersion."
          }

      - name: Typecheck, test, and build
        run: pnpm check

      - name: Package and publish installed app
        shell: pwsh
        run: |
          pnpm exec electron-builder --win nsis --publish never
          if ($LASTEXITCODE -ne 0) { throw "Desktop packaging failed." }
          pnpm desktop:verify:package-assets
          if ($LASTEXITCODE -ne 0) { throw "Packaged desktop asset verification failed." }

          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $installers = @(Get-ChildItem -LiteralPath release-desktop -Filter '*Setup*.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one installer, found $($installers.Count)." }

          $installer = $installers[0]
          $blockMap = Get-Item -LiteralPath ($installer.FullName + '.blockmap')
          $metadata = Get-Item -LiteralPath 'release-desktop\latest.yml'

          $safeInstallerPath = Join-Path $installer.DirectoryName ($installer.Name -replace ' ', '-')
          $safeBlockMapPath = $safeInstallerPath + '.blockmap'
          Move-Item -LiteralPath $installer.FullName -Destination $safeInstallerPath
          Move-Item -LiteralPath $blockMap.FullName -Destination $safeBlockMapPath

          $safeInstaller = Get-Item -LiteralPath $safeInstallerPath
          $safeBlockMap = Get-Item -LiteralPath $safeBlockMapPath
          $metadataText = Get-Content -LiteralPath $metadata.FullName -Raw
          if (-not $metadataText.Contains($safeInstaller.Name)) { throw "Updater metadata does not reference $($safeInstaller.Name)." }

          gh release create "${{ github.ref_name }}" $safeInstaller.FullName $safeBlockMap.FullName $metadata.FullName --title "Sloppy Potato Fantasy Football $packageVersion" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
